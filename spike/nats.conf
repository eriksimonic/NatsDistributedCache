server_name: $SERVER_NAME
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  # Design section 3: explicit default, never "always"
  sync_interval: 2m
}

cluster {
  name: spike
  listen: 0.0.0.0:6222
  # Clients connect from the host; don't advertise container IPs
  no_advertise: true
  routes: [
    nats://nats-1:6222
    nats://nats-2:6222
    nats://nats-3:6222
  ]
}
